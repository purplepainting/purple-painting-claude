<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Purple Painting Dashboard</title>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #F7F6FA; color: #1C1726; }
    header { background: #2E1248; color: #fff; padding: 16px 32px; display: flex; align-items: center; gap: 12px; }
    .logo { width: 36px; height: 36px; border-radius: 8px; background: #6B2FA3; display: flex; align-items: center; justify-content: center; font-weight: 800; }
    main { max-width: 900px; margin: 0 auto; padding: 48px 32px; }
    h1 { margin: 0 0 8px; font-size: 32px; }
    p { color: #5E566B; font-size: 16px; }
  </style>
</head>
<body>
  <header>
    <div class="logo">P</div>
    <strong>Purple Painting</strong>
  </header>
  <main>
    <h1>Purple Painting Dashboard</h1>
    <p id="welcome">Signed in.</p>
    <p>Deployed from GitHub. Modules coming soon.</p>
  </main>
  <script>
    // App Service Authentication exposes the signed-in user at /.auth/me
    fetch('/.auth/me')
      .then(r => r.ok ? r.json() : [])
      .then(d => {
        const claims = (d[0] && d[0].user_claims) || [];
        const name = (claims.find(c => c.typ === 'name') || {}).val;
        if (name) document.getElementById('welcome').textContent = 'Signed in as ' + name + '.';
      })
      .catch(() => {});
  </script>
</body>
</html>
