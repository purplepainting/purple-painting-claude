name: Deploy dashboard

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard-deploy.yml'
  workflow_dispatch:

# One deploy at a time, in order. Two merges close together must not race,
# or an older build can finish last and overwrite the newer one.
concurrency:
  group: dashboard-deploy
  cancel-in-progress: false

env:
  AZURE_WEBAPP_NAME: PurpleDashboard
  PROJECT_PATH: dashboard/Dashboard.csproj
  DOTNET_VERSION: '10.0.x'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build and publish
        run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -o ${{ runner.temp }}/dashboard-publish

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ runner.temp }}/dashboard-publish
